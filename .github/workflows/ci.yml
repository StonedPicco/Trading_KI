name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ati
          POSTGRES_PASSWORD: ati
          POSTGRES_DB: ati_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ati" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://ati:ati@localhost:5432/ati_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check app tests
      - name: Ruff (format)
        run: uv run ruff format --check app tests
      - name: Mypy
        run: uv run mypy app
      - name: Migrations apply cleanly and match models
        env:
          DATABASE_URL: postgresql+asyncpg://ati:ati@localhost:5432/ati_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Tests (SQLite + PostgreSQL)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Static dashboard for the one-click start builds
        run: npm run build:web

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
